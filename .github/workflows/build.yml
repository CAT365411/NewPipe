name: Build Custom Anti-RU APK

on:
  push:
    branches: [ dev, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -x runCheckstyle -x check --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anti-Russian-YouTube-APK
          path: app/build/outputs/apk/debug/app-debug.apk
